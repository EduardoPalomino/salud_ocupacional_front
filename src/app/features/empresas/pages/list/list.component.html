<p-card class="dashboard">
  <div class="flex grid adminPanel">
    <div class="col-12 top pb-0 pt-3">
      <!--logo-->
      <div class="grid">
        <div class="col-2 box-prime">
          <div class="navbar-logo flex align-items-center justify-content-between pt-2 pb-2 pl-2">
            <img class="logo-empresa" src="assets/images/admin/ecuanticorp-logo.png"  alt="Ecuanticorp" height="25px" >
            <a id="mobile-collapse" href="#" class="mobile-menu">
              <i class="pi pi-bars"></i>
            </a>
          </div>
        </div>
        <div class="col-10 box-prime top-menu">
          <!-- CONTENIDO DE SUPERIOR LOGIN, GLOBITO, ETC -->
          <ul class="user-perfil">
            <li>

            </li>
            <li>

            </li>
            <li>
                <div class="item-perfil img"><img class="user-perfil-img" src="{{apiUrl+'..'+archivo}}"></div>
                <div class="item-perfil text"><menu-perfil  label="{{nombre}} {{apellido}}"></menu-perfil></div>
            </li>
          </ul>
        </div>
      </div>
      <!--logo-->
    </div>
    <!--sidebar-->
    <div class="col-2 sidebar">
      <div class="navbar-menu">
        <div class="col-12 navigation">Navegación</div>
        <div class="col-12 menu-link">
          <menu-sidebar></menu-sidebar>
        </div>
      </div>
    </div>

    <!--sidebar-->
    <div class="col-10 main p-1">
      <div class="grid dashboard card4">
        <div class="col-12 filtro">
          <div class="e-card m-1">
            <!--  filtro-->
            <div class="p-datatable-header">
              <h1>Gestión de Empresa</h1>
              <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <div class="col-3">
                  <span class="p-input-icon-left">
                      <i class="pi pi-search"></i>
                      <input
                        pInputText
                        type="text"
                        placeholder="Búsqueda"
                        class="p-inputtext p-component p-element w-full"
                        [(ngModel)]="globalFilter"
                        (keyup.enter)="filtrar(globalFilter)"
                        (blur)="filtrar(globalFilter)">
                    </span>
                </div>
                <div class="col-2">
                  <button pButton icon="pi pi-user-plus" label="Nuevo Empresa"
                          class="p-button-sm p-button-outlined btn_purple" (click)="openModal('Nuevo')">
                  </button>
                </div>

              </div>
            </div>
            <!--  filtro-->
          </div>
        </div>
        <div class="col-12 data">
           <div class="e-card m-1">
              <p-card>
            <!--contenido-->
            <p-toast></p-toast>
            <p-table #table [value]="empresas" [paginator]="false" [rows]="10" [rowsPerPageOptions]="[10, 20, 50, 100]"
             [globalFilterFields]="['nombre','ruc','direccion','telefono','email','estado']" [responsiveLayout]="'scroll'">
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="key">Id </th>
          <th pSortableColumn="nombre">Nombre </th>
          <th pSortableColumn="ruc">Ruc </th>
          <th pSortableColumn="direccion">Direccion </th>
          <th pSortableColumn="telefono">Telefono </th>
          <th pSortableColumn="email">Email </th>
          <th pSortableColumn="estado">Estado </th>
          <th>Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-empresa let-i="rowIndex">
        <tr>
          <td>{{ empresa.key }}</td>
          <td>{{ empresa.nombre}}</td>
          <td>{{ empresa.ruc}}</td>
          <td>{{ empresa.direccion}}</td>
          <td>{{ empresa.telefono}}</td>
          <td>{{ empresa.email}}</td>
          <td>{{ empresa.estado}}</td>
          <td>
            <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm p-button-warning" (click)="openModal('Editar', empresa)"></button>
            <button pButton icon="pi pi-trash" class="p-button-text p-button-sm p-button-danger" (click)="confirmarEliminacion(empresa)"></button>
          </td>
        </tr>
      </ng-template>
    </p-table>
            <!-- Paginación personalizada -->
            <div class="pagination-container">
  <button (click)="onPageChange(1)" [disabled]="pagination.currentPage === 1" class="pagination-button">
    <i class="pi pi-angle-double-left"></i>
  </button>
  <button (click)="onPageChange(pagination.currentPage - 1)" [disabled]="pagination.currentPage === 1" class="pagination-button">
    <i class="pi pi-angle-left"></i>
  </button>

  <span class="pagination-info">
    Página {{ pagination.currentPage }} de {{ pagination.totalPages }}
  </span>

  <button (click)="onPageChange(pagination.currentPage + 1)" [disabled]="pagination.currentPage === pagination.totalPages" class="pagination-button">
    <i class="pi pi-angle-right"></i>
  </button>
  <button (click)="onPageChange(pagination.totalPages)" [disabled]="pagination.currentPage === pagination.totalPages" class="pagination-button">
    <i class="pi pi-angle-double-right"></i>
  </button>

</div>
            <!-- end Paginación personalizada -->
            <!-- Confirmation -->
            <p-confirmDialog></p-confirmDialog>
            <!-- Confirmation -->
            <!-- Modal -->
            <p-dialog [(visible)]="modalVisible" [header]="modalTitle" [modal]="true" [closable]="true" [style]="{width: '500px'}">
              <form [formGroup]="empresaForm" >
                <div class="p-fluid">
                               
                <div class="p-field"><label>Nombre</label>
                <input pInputText id="nombreInput" formControlName="nombre" />
                </div>

                <div class="p-field"><label>Ruc</label>
                <input pInputText id="rucInput" formControlName="ruc" />
                </div>

                <div class="p-field"><label>Direccion</label>
                <input pInputText id="direccionInput" formControlName="direccion" />
                </div>

                <div class="p-field"><label>Telefono</label>
                <input pInputText id="telefonoInput" formControlName="telefono" />
                </div>

                <div class="p-field"><label>Email</label>
                <input pInputText id="emailInput" formControlName="email" />
                </div>

                <div class="p-field"><label>Estado</label>
                <input pInputText id="estadoInput" formControlName="estado" />
                </div>
                  <input pInputText id="_idInput" formControlName="_id" [hidden]="true"  />
                    
                    
                </div>
                <div class="p-dialog-footer">
                  <button pButton type="button" label="Cancelar" class="p-button-text btn_purple" (click)="modalVisible = false"></button>
                  <button pButton type="button" label="Guardar" class="p-button-text btn_purple" (click)="saveRegistro()"></button>
                </div>
              </form>
            </p-dialog>
            <!-- Modal -->
            <!--contenido-->
          </p-card>
            </div>
        </div>
      </div>
    </div>
  </div>
</p-card>
